version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: smartlogix-db
    restart: always
    environment:
      POSTGRES_DB: smartlogix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: smartlogix-backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smartlogix

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: smartlogix-frontend
    depends_on:
      - backend
    ports:
      - "8501:8501"

volumes:
  postgres_data: