name: SmartLogix AI CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI Imports
        run: |
          python -c "from backend.app.main import app; print('FastAPI import successful')"

      - name: Verify ML Models
        run: |
          python -c "from ai_engine.demand_forecasting.model import DemandModel; print('Demand model loaded')"
          python -c "from ai_engine.route_eta.model import EtaModel; print('ETA model loaded')"

      - name: Build Docker Images
        run: |
          docker compose build